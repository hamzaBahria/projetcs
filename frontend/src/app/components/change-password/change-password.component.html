<div class="password-container">
  <div class="password-card">
    <h1>Changer le mot de passe</h1>

    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="current_password">Mot de passe actuel</label>
        <input id="current_password" type="password" formControlName="current_password" placeholder="Votre mot de passe actuel">
        <span class="error" *ngIf="passwordForm.get('current_password')?.invalid && passwordForm.get('current_password')?.touched">
          Requis
        </span>
      </div>

      <div class="form-group">
        <label for="new_password">Nouveau mot de passe</label>
        <input id="new_password" type="password" formControlName="new_password" placeholder="Min 8 caractères">
        <span class="error" *ngIf="passwordForm.get('new_password')?.invalid && passwordForm.get('new_password')?.touched">
          Minimum 8 caractères
        </span>
      </div>

      <div class="form-group">
        <label for="new_password_confirmation">Confirmer</label>
        <input id="new_password_confirmation" type="password" formControlName="new_password_confirmation" placeholder="Répétez">
        <span class="error" *ngIf="passwordForm.errors?.['notMatching'] && passwordForm.get('new_password_confirmation')?.touched">
          Les mots de passe ne correspondent pas
        </span>
      </div>

      <div class="error-message" *ngIf="error">{{ error }}</div>
      <div class="success-message" *ngIf="success">{{ success }}</div>

      <button type="submit" class="btn-primary" [disabled]="passwordForm.invalid || loading">
        {{ loading ? 'Modification...' : 'Modifier le mot de passe' }}
      </button>
    </form>
  </div>
</div>
