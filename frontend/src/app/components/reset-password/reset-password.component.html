<div class="auth-container">
  <div class="auth-card">
    <h1>Réinitialiser le mot de passe</h1>
    <p class="subtitle">Entrez votre nouveau mot de passe</p>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="votre@email.com">
      </div>

      <div class="form-group">
        <label for="password">Nouveau mot de passe</label>
        <input id="password" type="password" formControlName="password" placeholder="Min 8 caractères, majuscule, minuscule, chiffre, spécial">
        <span class="error" *ngIf="resetForm.get('password')?.invalid && resetForm.get('password')?.touched">
          <span *ngIf="resetForm.get('password')?.errors?.['minlength']">Minimum 8 caractères</span>
          <span *ngIf="resetForm.get('password')?.errors?.['complexity']">Doit contenir majuscule, minuscule, chiffre et caractère spécial (@$!%*?&)</span>
        </span>
      </div>

      <div class="form-group">
        <label for="password_confirmation">Confirmer</label>
        <input id="password_confirmation" type="password" formControlName="password_confirmation" placeholder="Répétez">
        <span class="error" *ngIf="resetForm.errors?.['notMatching'] && resetForm.get('password_confirmation')?.touched">
          Les mots de passe ne correspondent pas
        </span>
      </div>

      <div class="error-message" *ngIf="error">{{ error }}</div>
      <div class="success-message" *ngIf="success">{{ success }}</div>

      <button type="submit" class="btn-primary" [disabled]="resetForm.invalid || loading">
        {{ loading ? 'Réinitialisation...' : 'Réinitialiser' }}
      </button>
    </form>
  </div>
</div>
