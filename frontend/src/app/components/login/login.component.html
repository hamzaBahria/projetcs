<div class="auth-container">
  <div class="auth-card">
    <h1>Connexion</h1>
    <p class="subtitle">Connectez-vous à votre compte</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="votre@email.com">
        <span class="error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Email valide requis
        </span>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" formControlName="password" placeholder="Votre mot de passe">
        <span class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Mot de passe requis
        </span>
      </div>

      <div class="error-message" *ngIf="error">{{ error }}</div>

      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid || loading">
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <div class="divider"><span>ou</span></div>

    <button class="btn-google" (click)="loginGoogle()">
      Se connecter avec Google
    </button>

    <div class="auth-links">
      <a routerLink="/forgot-password">Mot de passe oublié ?</a>
      <a routerLink="/register">Créer un compte</a>
    </div>
  </div>
</div>
