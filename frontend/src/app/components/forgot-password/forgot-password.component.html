<div class="auth-container">
  <div class="auth-card">
    <h1>Mot de passe oublié</h1>
    <p class="subtitle">Entrez votre email pour recevoir un lien de réinitialisation</p>

    <form [formGroup]="emailForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="votre@email.com">
        <span class="error" *ngIf="emailForm.get('email')?.invalid && emailForm.get('email')?.touched">
          Email valide requis
        </span>
      </div>

      <div class="error-message" *ngIf="error">{{ error }}</div>
      <div class="success-message" *ngIf="success">{{ success }}</div>

      <button type="submit" class="btn-primary" [disabled]="emailForm.invalid || loading">
        {{ loading ? 'Envoi...' : 'Envoyer le lien' }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/login">Retour à la connexion</a>
    </div>
  </div>
</div>
