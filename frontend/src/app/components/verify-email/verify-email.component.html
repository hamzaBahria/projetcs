<div class="auth-container">
  <div class="auth-card">
    <div *ngIf="!verified">
      <div class="icon">&#9993;</div>
      <h1>Vérifiez votre email</h1>
      <p class="subtitle">
        Saisissez le code à 6 chiffres reçu par email.
      </p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="votre@email.com"
          />
          <span
            class="error"
            *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
          >
            <span *ngIf="form.get('email')?.errors?.['required']"
              >Email requis</span
            >
            <span *ngIf="form.get('email')?.errors?.['email']"
              >Email invalide</span
            >
          </span>
        </div>

        <div class="form-group">
          <label for="code">Code de vérification</label>
          <input
            id="code"
            type="text"
            formControlName="code"
            placeholder="000000"
            maxlength="6"
            style="
              letter-spacing: 6px;
              font-size: 24px;
              text-align: center;
              font-weight: bold;
            "
          />
          <span
            class="error"
            *ngIf="form.get('code')?.invalid && form.get('code')?.touched"
          >
            <span *ngIf="form.get('code')?.errors?.['required']"
              >Code requis</span
            >
            <span *ngIf="form.get('code')?.errors?.['pattern']"
              >Code à 6 chiffres</span
            >
          </span>
        </div>

        <div class="error-message" *ngIf="error">{{ error }}</div>
        <div class="success-message" *ngIf="success">{{ success }}</div>

        <button
          type="submit"
          class="btn-primary"
          [disabled]="form.invalid || loading"
        >
          {{ loading ? "Vérification..." : "Vérifier" }}
        </button>
      </form>

      <div class="auth-links">
        <a routerLink="/login">Aller à la connexion</a>
      </div>
    </div>

    <div *ngIf="verified">
      <div class="icon success-icon">&#10004;</div>
      <h1>Compte activé !</h1>
      <p>
        Votre email est vérifié. Vous allez être redirigé...
      </p>
      <a
        routerLink="/dashboard"
        class="btn-primary"
        style="
          display: block;
          text-align: center;
          margin-top: 1.5rem;
          text-decoration: none;
        "
        >Tableau de bord</a
      >
    </div>
  </div>
</div>
