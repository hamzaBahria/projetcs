<div class="profile-container">
  <div class="profile-card">
    <h1>Mon Profil</h1>

    <div class="avatar-section">
      <div class="avatar">
        <img *ngIf="user?.avatar_url" [src]="user?.avatar_url" alt="Avatar">
        <span *ngIf="!user?.avatar_url" class="avatar-placeholder">{{ user?.name?.charAt(0) }}</span>
      </div>
      <label class="upload-btn">
        Changer l'avatar
        <input type="file" accept="image/*" (change)="onFileSelected($event)" hidden>
      </label>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nom</label>
        <input type="text" formControlName="name" [readonly]="!editing">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" [readonly]="!editing">
      </div>

      <div class="error-message" *ngIf="error">{{ error }}</div>
      <div class="success-message" *ngIf="success">{{ success }}</div>

      <div class="actions">
        <button *ngIf="!editing" type="button" class="btn-secondary" (click)="toggleEdit()">Modifier</button>
        <ng-container *ngIf="editing">
          <button type="submit" class="btn-primary" [disabled]="profileForm.invalid || loading">
            {{ loading ? 'Sauvegarde...' : 'Enregistrer' }}
          </button>
          <button type="button" class="btn-cancel" (click)="toggleEdit()">Annuler</button>
        </ng-container>
      </div>
    </form>

    <div class="delete-section">
      <hr>
      <h3>Zone dangereuse</h3>
      <p>Une fois votre compte supprimé, toutes vos données seront effacées définitivement.</p>
      <button *ngIf="!showDeleteConfirm" type="button" class="btn-danger" (click)="confirmDelete()">Supprimer mon compte</button>

      <div *ngIf="showDeleteConfirm" class="delete-confirm">
        <div *ngIf="user?.google_id">
          <p>Votre compte a été créé avec Google. Aucun mot de passe requis.</p>
        </div>
        <div *ngIf="!user?.google_id">
          <p>Entrez votre mot de passe pour confirmer la suppression :</p>
          <input type="password" [(ngModel)]="deletePassword" placeholder="Mot de passe" [ngModelOptions]="{standalone: true}">
        </div>
        <div class="delete-actions">
          <button type="button" class="btn-danger" (click)="deleteAccount()" [disabled]="(!user?.google_id && !deletePassword) || deleting">
            {{ deleting ? 'Suppression...' : 'Confirmer la suppression' }}
          </button>
          <button type="button" class="btn-cancel" (click)="cancelDelete()">Annuler</button>
        </div>
      </div>
    </div>
  </div>
</div>
