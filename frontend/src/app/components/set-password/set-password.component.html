<div class="auth-container">
  <div class="auth-card">
    <h1>Définir le mot de passe</h1>
    <p class="subtitle">Créez un mot de passe pour votre compte <strong>{{ email }}</strong></p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" formControlName="password" placeholder="Min 8 caractères, majuscule, minuscule, chiffre, spécial">
        <span class="error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          <span *ngIf="form.get('password')?.errors?.['required']">Mot de passe requis</span>
          <span *ngIf="form.get('password')?.errors?.['minlength']">Minimum 8 caractères</span>
          <span *ngIf="form.get('password')?.errors?.['complexity']">Doit contenir majuscule, minuscule, chiffre et caractère spécial (&#64;$!%*?&)</span>
        </span>
      </div>

      <div class="form-group">
        <label for="password_confirmation">Confirmer le mot de passe</label>
        <input id="password_confirmation" type="password" formControlName="password_confirmation" placeholder="Confirmez le mot de passe">
        <span class="error" *ngIf="form.get('password_confirmation')?.invalid && form.get('password_confirmation')?.touched">
          <span *ngIf="form.get('password_confirmation')?.errors?.['required']">Confirmation requise</span>
        </span>
        <span class="error" *ngIf="form.errors?.['notMatching'] && form.get('password_confirmation')?.touched">
          Les mots de passe ne correspondent pas
        </span>
      </div>

      <div class="error-message" *ngIf="error">{{ error }}</div>

      <button type="submit" class="btn-primary" [disabled]="form.invalid || loading">
        {{ loading ? 'Enregistrement...' : 'Créer mon mot de passe' }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/login">Aller à la connexion</a>
    </div>
  </div>
</div>
